name: Fork build

# Fork-local build pipeline. Upstream release.yml needs infrastructure this
# fork does not have (Blacksmith runner labels, Cloudflare relay secrets, npm
# trusted publishing), so this calls the reusable release-desktop.yml on
# standard GitHub runners and produces the same installable artifacts:
# desktop installers, the `t3` npm tarball, and the self-contained CLI
# archives that SSH-managed environments download from a GitHub release.
#
# release_channel: preview keeps every artifact unsigned and emits no updater
# manifests. SHA256SUMS is written over the CLI archives exactly like the
# upstream release job, because remote SSH installs verify against it.
# Remove this file before opening a PR upstream.

on:
  push:
    branches:
      - feat/hermes-acp-provider
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build JS bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      T3CODE_FORK_VERSION: 0.0.40-hermes.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - uses: ./.github/actions/setup-apt-mirrors

      # @t3tools/desktop#build compiles the Linux browser secret helper, which
      # needs libsecret headers.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install bundle dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$T3CODE_FORK_VERSION"

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Linux x64
    needs: [bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      version: 0.0.40-hermes.${{ github.run_number }}
      ref: ${{ github.sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  # The Windows job embeds the same-arch Linux CLI archive as its WSL runtime,
  # so it cannot start until linux uploads cli-linux-x64.
  windows:
    name: Windows x64
    needs: [bundle, linux]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Windows x64
      runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      version: 0.0.40-hermes.${{ github.run_number }}
      ref: ${{ github.sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  npm_tarball:
    name: CLI tarball (npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [bundle]
    env:
      T3CODE_FORK_VERSION: 0.0.40-hermes.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install CLI dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$T3CODE_FORK_VERSION"

      - name: Pack CLI tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-out"
          # pnpm pack cannot resolve workspace:* ranges (t3's workspace deps
          # are devDependencies, bundled into dist and never installed from the
          # registry). Pin versioned ones and drop unversioned ones before
          # packing — same rewrite cli.ts publish performs before npm publish.
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.GITHUB_WORKSPACE;
          const pkgPath = path.join(root, 'apps/server/package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const candidates = ['packages', 'apps'].flatMap(d =>
            fs.readdirSync(path.join(root, d)).map(sub => path.join(root, d, sub, 'package.json')));
          for (const section of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
            for (const [name, range] of Object.entries(pkg[section] || {})) {
              if (typeof range === 'string' && range.startsWith('workspace:')) {
                const depPath = candidates.find(p => {
                  try { return JSON.parse(fs.readFileSync(p, 'utf8')).name === name; } catch { return false; }
                });
                const ver = depPath && JSON.parse(fs.readFileSync(depPath, 'utf8')).version;
                if (ver) pkg[section][name] = ver;
                else delete pkg[section][name];
              }
            }
          }
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          EOF
          cd apps/server
          vp pm pack --pack-destination "$GITHUB_WORKSPACE/release-out"

      - name: Upload CLI tarball
        uses: actions/upload-artifact@v7
        with:
          name: t3-cli
          path: release-out/*.tgz
          if-no-files-found: error

  finalize:
    name: Collect release assets
    needs: [linux, windows, npm_tarball]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets

      # Remote SSH installs verify their archive against this file, so write
      # it over the exact bytes that ship — same as the upstream release job.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: t3-release-assets
          path: release-assets/*
          if-no-files-found: error
