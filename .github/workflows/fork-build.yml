name: Fork build

# Fork-local build pipeline. Upstream release.yml needs infrastructure this
# fork does not have (Blacksmith runner labels, Cloudflare relay secrets, npm
# trusted publishing), so this builds the same installable artifacts on
# standard GitHub runners: the `t3` CLI tarball and the Linux desktop AppImage.
#
# Signing, T3 Connect/relay, and npm publishing are all skipped — artifacts
# are unsigned workflow artifacts, not a published release.
# Remove this file before opening a PR upstream.

on:
  push:
    branches:
      - feat/hermes-acp-provider
  workflow_dispatch:

permissions:
  contents: read

env:
  T3CODE_FORK_VERSION: 0.0.40-hermes.${{ github.run_number }}

jobs:
  cli:
    name: CLI tarball (npx t3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install CLI dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$T3CODE_FORK_VERSION"

      - name: Build CLI package
        run: vp run --filter t3 build

      - name: Pack CLI tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release-out"
          # pnpm pack cannot resolve workspace:* ranges (t3's workspace deps
          # are devDependencies, bundled into dist and never installed from the
          # registry). Pin versioned ones and drop unversioned ones before
          # packing — same rewrite cli.ts publish performs before npm publish.
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.GITHUB_WORKSPACE;
          const pkgPath = path.join(root, 'apps/server/package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const candidates = ['packages', 'apps'].flatMap(d =>
            fs.readdirSync(path.join(root, d)).map(sub => path.join(root, d, sub, 'package.json')));
          for (const section of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
            for (const [name, range] of Object.entries(pkg[section] || {})) {
              if (typeof range === 'string' && range.startsWith('workspace:')) {
                const depPath = candidates.find(p => {
                  try { return JSON.parse(fs.readFileSync(p, 'utf8')).name === name; } catch { return false; }
                });
                const ver = depPath && JSON.parse(fs.readFileSync(depPath, 'utf8')).version;
                if (ver) pkg[section][name] = ver;
                else delete pkg[section][name];
              }
            }
          }
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          EOF
          cd apps/server
          vp pm pack --pack-destination "$GITHUB_WORKSPACE/release-out"

      - name: Upload CLI tarball
        uses: actions/upload-artifact@v7
        with:
          name: t3-cli
          path: release-out/*.tgz
          if-no-files-found: error

  desktop:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install Linux desktop build libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get install -y imagemagick
          fi

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "$T3CODE_FORK_VERSION"

      - name: Build desktop artifact
        run: vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 --build-version "$T3CODE_FORK_VERSION" --verbose

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: t3-desktop-linux-x64
          path: |
            release/*.AppImage
            release/*.yml
          if-no-files-found: error

  # The WSL node-pty prebuild upstream bundles is skipped here — this build is
  # for native Windows use, so the packaged WSL backend is dead weight. If you
  # ever need it, replicate upstream's build_wsl_node_pty job and pass
  # --wsl-prebuild to the artifact build.
  desktop_windows:
    name: Windows installer (nsis, unsigned)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "$T3CODE_FORK_VERSION"

      - name: Build desktop artifact
        shell: bash
        run: vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "$T3CODE_FORK_VERSION" --verbose

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: t3-desktop-win-x64
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
